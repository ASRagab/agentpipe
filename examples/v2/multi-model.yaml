# AgentPipe v2 - Multi-Model Comparison
# ==========================================
# Compare multiple models from the same provider (OpenRouter).
# This configuration includes models across different capability tiers
# to help you find the right price/performance balance.
#
# Requirements:
#   - OPENROUTER_API_KEY environment variable set
#
# Usage:
#   export OPENROUTER_API_KEY=your-key-here
#   agentpipe run --v2 -c examples/v2/multi-model.yaml
#
# Models included (price tiers):
#   - Claude 3 Haiku: Fast and cheap ($0.25/$1.25 per 1M tokens)
#   - Claude Sonnet: Balanced ($3/$15 per 1M tokens)
#   - GPT-4o-mini: OpenAI's efficient option ($0.15/$0.60 per 1M tokens)
#   - Gemini 1.5 Flash: Google's fast model (free tier available)

conversation:
  timeout: 30s
  mode: parallel
  max_turns: 15       # Keep token usage reasonable with 4 agents

agents:
  # Fast tier - Claude Haiku
  - id: haiku
    type: openrouter
    name: Haiku
    model: anthropic/claude-3-haiku
    timeout: 15s       # Fast model, short timeout
    config:
      api_key_env: OPENROUTER_API_KEY
      system_prompt: "You are Claude Haiku. Be quick and concise. Prioritize speed."
      temperature: 0.5
      max_tokens: 500

  # Balanced tier - Claude Sonnet
  - id: sonnet
    type: openrouter
    name: Sonnet
    model: anthropic/claude-sonnet-4-20250514
    timeout: 30s
    config:
      api_key_env: OPENROUTER_API_KEY
      system_prompt: "You are Claude Sonnet. Balance depth with conciseness."
      temperature: 0.7
      max_tokens: 800

  # OpenAI efficient - GPT-4o-mini
  - id: gpt4o-mini
    type: openrouter
    name: GPT-4o-mini
    model: openai/gpt-4o-mini
    timeout: 20s
    config:
      api_key_env: OPENROUTER_API_KEY
      system_prompt: "You are GPT-4o-mini. Provide helpful, concise responses."
      temperature: 0.6
      max_tokens: 600

  # Google's fast model - Gemini Flash
  - id: gemini
    type: openrouter
    name: Gemini Flash
    model: google/gemini-flash-1.5
    timeout: 20s
    config:
      api_key_env: OPENROUTER_API_KEY
      system_prompt: "You are Gemini Flash. Be quick, accurate, and helpful."
      temperature: 0.6
      max_tokens: 600

tui:
  enabled: true
  show_metrics: true   # Compare costs across models in real-time

logging:
  level: info

persistence:
  auto_save: false     # Don't auto-save comparison sessions
