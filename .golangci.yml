version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - dupl
    - gocognit
    - gocyclo
    - gosec
    - misspell
    - prealloc
    - unconvert
  settings:
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: true
      check-blank: false
    gocognit:
      min-complexity: 30
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G104
        - G204
        - G304
        - G301
    govet:
      enable:
        - shadow
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - gosec
          - gocyclo
          - gocognit
          - govet
          - ineffassign
          - unused
        path: _test\.go
      - linters:
          - gosec
        path: pkg/adapters/
        text: 'G204:'
      - linters:
          - gocognit
          - gocyclo
        path: (cmd/|main\.go)
      - linters:
          - gocognit
          - gocyclo
        path: pkg/tui/
      - linters:
          - gocognit
          - gocyclo
        path: pkg/v2/tui/
      - linters:
          - govet
        path: pkg/v2/tui/
        text: copylocks
      - linters:
          - gocognit
          - gocyclo
        path: pkg/v2/config/
      - linters:
          - gocyclo
          - gocognit
        path: pkg/v2/persistence/
      - linters:
          - errcheck
          - gosec
          - govet
          - unused
          - unconvert
        path: examples/
      - linters:
          - govet
        path: pkg/v2/pool/
        text: (copylocks|shadow)
      - linters:
          - govet
        path: pkg/v2/config/migrate\.go
        text: shadow
      - linters:
          - gosec
        path: pkg/v2/config/
        text: 'G306:'
      - linters:
          - gosec
        path: pkg/artifact/
        text: 'G306:'
      - linters:
          - dupl
          - gocognit
          - gocyclo
        path: pkg/adapters/
      - linters:
          - dupl
          - gocognit
          - gocyclo
        path: pkg/v2/adapters/
      - linters:
          - dupl
        path: internal/registry/
      - linters:
          - gocognit
          - gocyclo
        path: pkg/orchestrator/
      - linters:
          - gocognit
          - gocyclo
        path: pkg/middleware/
      - linters:
          - gocognit
          - gocyclo
        path: test/integration/
      - linters:
          - gosec
        path: pkg/orchestrator/
        text: 'G404:'
      - linters:
          - gosec
        path: cmd/init.go
        text: 'G306:'
      - linters:
          - errcheck
          - gosec
        path: internal/version/version.go
        text: fmt.Sscanf
      - linters:
          - errcheck
          - gosec
        path: cmd/root.go
        text: cmd.Help
      - linters:
          - errcheck
        path: internal/version/version.go
        text: resp.Body.Close
      - linters:
          - errcheck
        path: pkg/logger/logger.go
        text: logFile.Close
      - linters:
          - errcheck
        text: fmt.Fprint
      - linters:
          - gosec
        path: pkg/config/config.go
        text: G304
      - linters:
          - gosec
        path: pkg/logger/
        text: (G304|G301)
      - linters:
          - staticcheck
        text: QF1003
      - linters:
          - staticcheck
        text: QF1008
      - linters:
          - staticcheck
        text: SA1006
        path: examples/
      - linters:
          - staticcheck
        text: SA4006
        path: _test\.go
      - linters:
          - staticcheck
        text: ST1005
        path: pkg/v2/adapters/
      - linters:
          - staticcheck
        text: SA1019
        path: pkg/v2/tui/
      - linters:
          - prealloc
        path: pkg/adapters/
      - linters:
          - misspell
        path: pkg/v2/
    paths:
      - third_party$
      - builtin$
      - examples$
      - agentpipe-artifacts/
      - v2demo/
      - v2tui/
      - autorun/
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/kevinelliott/agentpipe
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - agentpipe-artifacts/
      - v2demo/
      - v2tui/
      - autorun/
